<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>E-Matdaan - Digital Voting System</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<div class="header">
  <div class="header-inner">
    <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg">

    <div>
      <div class="header-title">E-Matdaan</div>
      <div class="header-sub">Digital Voting System | Government of India (Demo)</div>
    </div>
  </div>
</div>

<!-- ================= MAIN ================= -->
<div class="container">

  <!-- ================= REGISTER ================= -->
  <div id="page_register" class="card">
    <h2>Register</h2>

    <label>Aadhaar Number</label>
    <input id="reg_aadhaar" maxlength="12">

    <br><br>

    <video id="reg_video" width="320" height="240" autoplay muted></video>

    <div class="row">
      <button id="reg_start_camera">Start Camera</button>
      <button id="reg_submit">Register</button>
    </div>

    <br>
    <button onclick="goToLogin()">Go to Login</button>
    <button onclick="goToResults()">Live Voting</button>
  </div>

  <!-- ================= LOGIN ================= -->
  <div id="page_login" class="card" style="display:none">
    <h2>Login</h2>

    <label>Aadhaar Number</label>
    <input id="login_aadhaar" maxlength="12">

    <br><br>

    <!-- OTP -->
    <button id="login_send_otp">Send OTP</button>

    <div id="otp_section" style="display:none">
      <input id="login_otp" placeholder="Enter OTP" maxlength="6">
      <button id="login_verify_otp">Verify OTP</button>
    </div>

    <br><br>

    <!-- FACE -->
    <div id="face_section" style="display:none">
      <p>Face Verification Required</p>

      <video id="login_video" width="320" height="240" autoplay muted></video>

      <div class="row">
        <button id="login_start_camera">Start Camera</button>
        <button id="login_submit">Login</button>
      </div>
    </div>

    <br>
    <button onclick="goToRegister()">Back to Register</button>
  </div>

  <!-- ================= VOTE ================= -->
  <div id="page_vote" class="card" style="display:none">
    <h2>Vote</h2>

    <div id="party_list"></div>

    <button onclick="goToResults()">Live Voting</button>
  </div>

  <!-- ================= RESULTS ================= -->
  <div id="page_results" class="card" style="display:none">
    <h2>Live Voting Results</h2>

    <div id="results_list"></div>

    <button onclick="goToRegister()">Back to Register</button>
  </div>

</div>

<!-- ================= FOOTER ================= -->
<div class="footer">
  Secure • Transparent • Verified
</div>

<script src="/static/app.js"></script>

</body>
</html>
